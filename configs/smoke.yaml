# Workflow check only; too short to measure control performance.
environment:
  n_links_range:
  - 1
  - 2
  max_links: 3
  nominal_eval_n_links: 2
  topology_eval_n_links:
  - 1
  - 2
  - 3
  cart_mass_range:
  - 0.5
  - 3.0
  link_length_range:
  - 0.3
  - 1.2
  link_mass_range:
  - 0.1
  - 2.0
  rail_limit: 2.5
  max_force: 20.0
  timestep: 0.001
  frame_skip: 4
  max_episode_steps: 32
  termination_angle: 0.7854
graph:
  node_feat_dim: 9
  edge_feat_dim: 2
rewards:
  upright_weight: 1.0
  alive_bonus: 0.1
  force_penalty: 0.001
  rail_penalty: 0.01
init:
  angle_noise: 0.05
  vel_noise: 0.01
ppo:
  hidden_dim: 32
  n_layers: 1
  n_heads: 2
  dropout: 0.1
  n_envs: 2
  rollout_steps: 32
  n_epochs: 1
  mini_batch_size: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  lr: 0.0001
  anneal_lr: true
  max_grad_norm: 0.5
  total_steps: 640
  save_interval: 100000
  gnn_transformer:
    n_heads: 2
    n_layers: 2
    entropy_coef: 0.03
  cgat:
    n_icga_layers: 1
    n_heads: 2
    entropy_coef: 0.03
dqn:
  n_action_bins: 51
  hidden_dim: 32
  n_mp_layers: 1
  replay_capacity: 512
  batch_size: 16
  gamma: 0.99
  lr: 5.0e-05
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 150000
  warmup_steps: 16
  update_freq: 4
  target_update_freq: 32
  weight_decay: 0.0001
  dropout: 0.1
  total_steps: 640
  log_interval: 64
  save_interval: 100000
